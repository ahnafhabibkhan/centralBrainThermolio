name: Validate local pilot
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -c constraints.txt -e '.[dev]' cfn-lint
      - run: python -m central_brain.manage init-local
      - run: docker compose up -d --wait
      - run: python -m central_brain.manage bootstrap --database central_brain_test
      - run: pytest -q --tb=short
      - run: python scripts/verify-local-restore.py
      - run: ruff check src tests scripts
      - run: cfn-lint deploy/pilot.yaml
      - run: docker build -t central-brain:test .
      - if: always()
        run: docker compose down -v
