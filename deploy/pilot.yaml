AWSTemplateFormatVersion: '2010-09-09'
Description: Central Brain single-instance pilot. Deploy only after explicit approval.
Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: A public subnet in the selected VPC with an internet gateway route.
  AvailabilityZone:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: Must match SubnetId.
  ImageId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
  PublicOrigin:
    Type: String
    Default: ''
    AllowedPattern: '(^$|https://[a-z0-9.-]+)'
    Description: Approved HTTPS origin without a trailing slash.
  OAuthDomainPrefix:
    Type: String
    AllowedPattern: '[a-z0-9-]{1,63}'
    Description: A unique Cognito hosted-login domain prefix.
  ChatGPTCallback:
    Type: String
    Default: ''
    AllowedPattern: '(^$|https://.+)'
    Description: Exact callback URL displayed during connector setup.
  ClaudeCallback:
    Type: String
    Default: ''
    AllowedPattern: '(^$|https://.+)'
    Description: Exact callback URL displayed during connector setup.
  AlertEmail:
    Type: String
    Default: ''
    Description: Approved address for service and budget alerts.
Conditions:
  CustomOrigin: !Not [!Equals [!Ref PublicOrigin, '']]
  HasChatGPT: !Not [!Equals [!Ref ChatGPTCallback, '']]
  HasClaude: !Not [!Equals [!Ref ClaudeCallback, '']]
  HasEmail: !Not [!Equals [!Ref AlertEmail, '']]
Resources:
  Backups:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Tags: [{Key: Project, Value: CentralBrain}]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireBackups
            Status: Enabled
            Prefix: backups/
            ExpirationInDays: 30
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
  BackupPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Backups
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt Backups.Arn, !Sub '${Backups.Arn}/*']
            Condition:
              Bool:
                aws:SecureTransport: 'false'
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore'
      Policies:
        - PolicyName: PilotStorageAndMetrics
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: !Sub '${Backups.Arn}/backups/*'
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub '${Backups.Arn}/releases/*'
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/central-brain/pilot/environment'
              - Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: '*'
                Condition:
                  StringEquals:
                    cloudwatch:namespace: CentralBrain
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      Tags: [{Key: Project, Value: CentralBrain}]
      GroupDescription: Public HTTPS and certificate validation only. Administration uses SSM.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImageId
      InstanceType: t4g.small
      PropagateTagsToVolumeOnCreation: true
      IamInstanceProfile: !Ref InstanceProfile
      CreditSpecification:
        CPUCredits: standard
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: false
          SubnetId: !Ref SubnetId
          GroupSet: [!Ref SecurityGroup]
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 8
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Project
          Value: CentralBrain
        - Key: Name
          Value: central-brain-pilot
  Address:
    Type: AWS::EC2::EIP
    Properties:
      Tags: [{Key: Project, Value: CentralBrain}]
      Domain: vpc
      InstanceId: !Ref Instance
  DatabaseDisk:
    Type: AWS::EC2::Volume
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AvailabilityZone: !Ref AvailabilityZone
      Size: 20
      VolumeType: gp3
      Encrypted: true
      Tags:
        - Key: Project
          Value: CentralBrain
  DiskAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties:
      Device: /dev/sdf
      InstanceId: !Ref Instance
      VolumeId: !Ref DatabaseDisk
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolTags:
        Project: CentralBrain
      UserPoolName: central-brain-pilot
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      MfaConfiguration: 'ON'
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      UserPoolTier: ESSENTIALS
      Policies:
        PasswordPolicy:
          MinimumLength: 14
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
  LoginDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref OAuthDomainPrefix
      UserPoolId: !Ref UserPool
      ManagedLoginVersion: 2
  ResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      UserPoolId: !Ref UserPool
      Identifier: !If [CustomOrigin, !Sub '${PublicOrigin}/mcp/', !Sub 'https://${Address}.sslip.io/mcp/']
      Name: Central Brain
      Scopes:
        - ScopeName: read
          ScopeDescription: Retrieve approved memories and reviewed skills.
        - ScopeName: propose
          ScopeDescription: Submit memories for human review.
        - ScopeName: review
          ScopeDescription: Review memory proposals.
        - ScopeName: admin
          ScopeDescription: Delete individual memories.
  WebClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: ResourceServer
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: central-brain-review
      GenerateSecret: true
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes:
        - openid
        - !If [CustomOrigin, !Sub '${PublicOrigin}/mcp//read', !Sub 'https://${Address}.sslip.io/mcp//read']
        - !If [CustomOrigin, !Sub '${PublicOrigin}/mcp//propose', !Sub 'https://${Address}.sslip.io/mcp//propose']
        - !If [CustomOrigin, !Sub '${PublicOrigin}/mcp//review', !Sub 'https://${Address}.sslip.io/mcp//review']
        - !If [CustomOrigin, !Sub '${PublicOrigin}/mcp//admin', !Sub 'https://${Address}.sslip.io/mcp//admin']
      CallbackURLs:
        - !If [CustomOrigin, !Sub '${PublicOrigin}/auth/callback', !Sub 'https://${Address}.sslip.io/auth/callback']
      SupportedIdentityProviders: [COGNITO]
      EnableTokenRevocation: true
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 60
      TokenValidityUnits:
        AccessToken: minutes
  ChatGPTClient:
    Type: AWS::Cognito::UserPoolClient
    Condition: HasChatGPT
    DependsOn: ResourceServer
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: central-brain-chatgpt
      GenerateSecret: true
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes:
        - openid
        - !If [CustomOrigin, !Sub '${PublicOrigin}/mcp//read', !Sub 'https://${Address}.sslip.io/mcp//read']
        - !If [CustomOrigin, !Sub '${PublicOrigin}/mcp//propose', !Sub 'https://${Address}.sslip.io/mcp//propose']
      CallbackURLs: [!Ref ChatGPTCallback]
      SupportedIdentityProviders: [COGNITO]
      EnableTokenRevocation: true
      PreventUserExistenceErrors: ENABLED
  ClaudeClient:
    Type: AWS::Cognito::UserPoolClient
    Condition: HasClaude
    DependsOn: ResourceServer
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: central-brain-claude
      GenerateSecret: true
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes:
        - openid
        - !If [CustomOrigin, !Sub '${PublicOrigin}/mcp//read', !Sub 'https://${Address}.sslip.io/mcp//read']
        - !If [CustomOrigin, !Sub '${PublicOrigin}/mcp//propose', !Sub 'https://${Address}.sslip.io/mcp//propose']
      CallbackURLs: [!Ref ClaudeCallback]
      SupportedIdentityProviders: [COGNITO]
      EnableTokenRevocation: true
      PreventUserExistenceErrors: ENABLED
  WebLoginBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    DependsOn: LoginDomain
    Properties:
      UserPoolId: !Ref UserPool
      ClientId: !Ref WebClient
      UseCognitoProvidedValues: true
  ChatGPTLoginBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    Condition: HasChatGPT
    DependsOn: LoginDomain
    Properties:
      UserPoolId: !Ref UserPool
      ClientId: !Ref ChatGPTClient
      UseCognitoProvidedValues: true
  ClaudeLoginBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    Condition: HasClaude
    DependsOn: LoginDomain
    Properties:
      UserPoolId: !Ref UserPool
      ClientId: !Ref ClaudeClient
      UseCognitoProvidedValues: true
  Alerts:
    Type: AWS::SNS::Topic
    Properties:
      Tags: [{Key: Project, Value: CentralBrain}]
      Subscription: !If
        - HasEmail
        - [{Protocol: email, Endpoint: !Ref AlertEmail}]
        - !Ref AWS::NoValue
  AlertsPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref Alerts]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: [budgets.amazonaws.com, cloudwatch.amazonaws.com]
            Action: sns:Publish
            Resource: !Ref Alerts
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
  InstanceAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The Central Brain instance failed its health checks.
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed
      Dimensions:
        - Name: InstanceId
          Value: !Ref Instance
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions: [!Ref Alerts]
  BackupAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: No successful Central Brain backup was reported in the last 26 hours.
      Namespace: CentralBrain
      MetricName: BackupSuccess
      Dimensions:
        - Name: InstanceId
          Value: !Ref Instance
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 26
      DatapointsToAlarm: 26
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref Alerts]
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    DependsOn: AlertsPolicy
    Properties:
      Budget:
        BudgetName: !Sub '${AWS::StackName}-project-spend'
        BudgetLimit:
          Amount: 20
          Unit: USD
        BudgetType: COST
        TimeUnit: MONTHLY
        CostFilters:
          TagKeyValue: ['user:Project$CentralBrain']
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref Alerts
  BudgetStopRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: budgets.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals: {aws:SourceAccount: !Ref AWS::AccountId}
      Policies:
        - PolicyName: StopOnlyCentralBrain
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ec2:StopInstances
                Resource: !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${Instance}'
              - Effect: Allow
                Action: [ec2:DescribeInstances, ec2:DescribeInstanceStatus]
                Resource: '*'
              - Effect: Allow
                Action: ssm:StartAutomationExecution
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}::automation-definition/AWS-StopEC2Instance:*'
  BudgetStop:
    Type: AWS::Budgets::BudgetsAction
    DependsOn: MonthlyBudget
    Properties:
      BudgetName: !Sub '${AWS::StackName}-project-spend'
      ActionType: RUN_SSM_DOCUMENTS
      ApprovalModel: AUTOMATIC
      NotificationType: ACTUAL
      ActionThreshold: {Type: ABSOLUTE_VALUE, Value: 16}
      ExecutionRoleArn: !GetAtt BudgetStopRole.Arn
      Definition:
        SsmActionDefinition:
          InstanceIds: [!Ref Instance]
          Region: !Ref AWS::Region
          Subtype: STOP_EC2_INSTANCES
      Subscribers:
        - Type: SNS
          Address: !Ref Alerts
Outputs:
  PublicUrl:
    Value: !If [CustomOrigin, !Ref PublicOrigin, !Sub 'https://${Address}.sslip.io']
  UserPoolId:
    Value: !Ref UserPool
  AlertsTopic:
    Value: !Ref Alerts
  InstanceId:
    Value: !Ref Instance
  PublicIp:
    Value: !Ref Address
  DatabaseVolumeId:
    Value: !Ref DatabaseDisk
  BackupBucket:
    Value: !Ref Backups
  OAuthIssuer:
    Value: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
  WebClientId:
    Value: !Ref WebClient
  ChatGPTClientId:
    Condition: HasChatGPT
    Value: !Ref ChatGPTClient
  ClaudeClientId:
    Condition: HasClaude
    Value: !Ref ClaudeClient
