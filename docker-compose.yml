name: central-brain-pilot
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:?Run python -m central_brain.manage init-local}
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - central_brain_pgdata:/var/lib/postgresql/data
volumes:
  central_brain_pgdata:
