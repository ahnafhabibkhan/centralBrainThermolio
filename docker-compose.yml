services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: central_brain
      POSTGRES_USER: central_brain
      POSTGRES_PASSWORD: change-me
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U central_brain -d central_brain"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - central_brain_data:/var/lib/postgresql/data

volumes:
  central_brain_data:
