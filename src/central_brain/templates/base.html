<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ title }} · Central Brain</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar"><a class="brand" href="/"><span class="brand-mark">cb</span> Central Brain</a>
  {% if request.session.get('sid') %}<nav aria-label="Main navigation">
    <a href="/">Memories</a><a href="/search">Search</a><a href="/skills">Skills</a>
    <form action="/logout" method="post"><input type="hidden" name="csrf_token" value="{{ csrf }}"><button class="quiet">Sign out</button></form>
  </nav>{% endif %}</header>
  <main>{% block content %}{% endblock %}</main>
  <footer>One place for the context you choose to keep.{% if local %} <span class="local">Local development</span>{% endif %}</footer>
</body></html>
